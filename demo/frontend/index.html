<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 赋能的软件逆向工程系统 · demo</title>
<link rel="stylesheet" href="/assets/style.css">
<script>
  // 先定主题再渲染，避免浅色闪一下
  (function () {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <b>软件逆向工程系统</b>
    <span class="tag">AI · RE</span>
  </div>
  <nav id="nav" class="nav">
    <a href="#/overview" data-view="overview">总览</a>
    <a href="#/structure" data-view="structure">代码结构</a>
    <a href="#/functions" data-view="functions">功能需求</a>
    <a href="#/architecture" data-view="architecture">系统架构</a>
    <a href="#/search" data-view="search">语义检索</a>
    <a href="#/impact" data-view="impact">变更影响</a>
    <a href="#/compare" data-view="compare">评测对比</a>
    <a href="#/docs" data-view="docs">文档生成</a>
  </nav>
  <div class="hud" id="hud">
    <span class="dot"></span><span id="hud-engine">ENGINE · —</span>
    <span class="hud-sep">/</span><span id="hud-status">SYNC · —</span>
    <button class="theme-btn" id="theme-btn" type="button" title="切换明暗主题"
      aria-label="切换明暗主题"><span id="theme-icon">◐</span></button>
  </div>
</header>

<main id="app" class="app">
  <div class="loading"><span class="spinner"></span>正在加载…</div>
</main>

<footer class="foot" id="foot">
  <span id="foot-left">PROJECT · —</span>
  <span class="foot-right">
    <span id="foot-right-text">PYTHON · SQLITE</span>
    <button class="link" id="print-btn" type="button">打印 / 导出 PDF</button>
  </span>
</footer>

<div id="toast" class="toast" hidden></div>
<script src="/assets/app.js"></script>
</body>
</html>
